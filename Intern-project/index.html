<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <div class="auth-wrapper">
        <div class="left-panel"><img  data-template-id="hero-image" class="canva-image" loading="lazy" alt="">
            <div class="left-text">
                <h1 data-template-id="welcome-title" class="canva-text"
                    style="font-size:2rem;font-weight:700;margin-bottom:0.5rem;"></h1>
                <p data-template-id="welcome-tagline" class="canva-text" style="font-size:1rem;"></p>
            </div>
        </div>
        <div class="right-panel"><input type="radio" name="auth-tab" id="tab-login" class="tab-radio" checked> <input
                type="radio" name="auth-tab" id="tab-register" class="tab-radio">
            <div class="glass-card">
                <div style="text-align:center;margin-bottom:1.5rem;">
                    <h2 data-template-id="logo-text" class="canva-text" style="font-size:1.4rem;font-weight:700;"></h2>
                </div>
                <div class="tab-labels"><label for="tab-login" class="tab-label label-login">Login</label> <label
                        for="tab-register" class="tab-label label-register">Register</label>
                </div><!-- Login Form -->
                <form class="form-login" onsubmit="return false;">
                    <div class="form-group"><label for="login-email">Email / Username</label> <input type="text"
                            id="login-email" data-template-id="login-email-input" class="canva-input">
                    </div>
                    <div class="form-group"><label for="login-pass">Password</label> <input type="password"
                            id="login-pass" data-template-id="login-pass-input" class="canva-input">
                    </div>
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;">
                        <div class="checkbox-row" style="margin-bottom:0;"><input type="checkbox" id="remember"><label
                                for="remember">Remember Me</label>
                        </div><a href="#" class="link">Forgot Password?</a>
                    </div><button type="submit" class="btn-primary" data-template-id="login-btn">Login</button>
                    <div class="divider">
                        or continue with
                    </div>
                    <div class="social-row"><span class="social-btn">G</span> <span class="social-btn">f</span> <span
                            class="social-btn">in</span>
                    </div>
                </form><!-- Register Form -->
                <form class="form-register" onsubmit="return false;">
                    <div class="form-group"><label for="reg-name">Full Name</label> <input type="text" id="reg-name"
                            placeholder="John Doe">
                    </div>
                    <div class="form-group"><label for="reg-user">Username</label> <input type="text" id="reg-user"
                            placeholder="johndoe">
                    </div>
                    <div class="form-group"><label for="reg-email">Email Address</label> <input type="email"
                            id="reg-email" placeholder="john@example.com">
                    </div>
                    <div class="form-group"><label for="reg-mobile">Mobile Number</label> <input type="tel"
                            id="reg-mobile" placeholder="+91 98765 43210">
                    </div>
                    <div class="form-group"><label for="reg-address">Address</label> <input type="text" id="reg-address"
                            placeholder="City, State">
                    </div>
                    <div class="form-group"><label for="reg-pass">Password</label> <input type="password" id="reg-pass"
                            placeholder="••••••••">
                    </div>
                    <div class="form-group"><label for="reg-confirm">Confirm Password</label> <input type="password"
                            id="reg-confirm" placeholder="••••••••">
                    </div>
                    <div class="form-group"><label for="reg-photo">Profile Photo</label> <input type="file"
                            id="reg-photo" accept="image/*" style="color:rgba(255,255,255,0.6);">
                    </div>
                    <div class="checkbox-row"><input type="checkbox" id="terms"><label for="terms">I agree to the <a
                                href="#" class="link">Terms &amp; Conditions</a></label>
                    </div><button type="submit" class="btn-primary" data-template-id="register-btn">Create
                        Account</button>
                </form>
                <p class="footer-text" data-template-id="footer-text"></p>
            </div>
        </div>
    </div>

</body>

</html>
