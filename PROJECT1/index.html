<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Canva UI Clone</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Top Navbar -->
<nav class="topbar">
    <div class="left-nav">
        <span>File</span>
        <span>Resize</span>
        <span>🪄Editing</span>
        <span>⏷</span>
        <span>|</span>
        <span>↶</span>
        <span>↷</span>
        <span>|</span>
        <span>ꪜ</span>
    </div>

    <div class="right-nav">
        <span>Sample</span>
        <span class="chat btn">🗠</span>
        <span class="chat btn">🗨</span>
        <span class="start btn">♛ Start your trail for $0</span>
        <button class="btn btn-light btn-sm">Present ▼</button>
        <button class="btn btn-light btn-sm">Share</button>
    </div>
</nav>

<div class="main-layout">

    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="menu-item">
            <i class="bi bi-grid"></i>
            <span>Templates</span>
        </div>

        <div class="menu-item">
            <i class="bi bi-box"></i>
            <span>Elements</span>
        </div>

        <div class="menu-item">
            <i class="bi bi-type"></i>
            <span>Text</span>
        </div>

        <div class="menu-item">
            <i class="bi bi-cloud-upload"></i>
            <span>Uploads</span>
        </div>

        <div class="menu-item">
            <i class="bi bi-tools"></i>
            <span>Tools</span>
        </div>
        <div class="menu-item">
            <i class="bi bi-music-note-beamed"></i>
            <span>Music</span>
        </div>

    </aside>

    <!-- Left Panel -->
    <section class="left-panel">

        <div class="search-box">
            <input type="text" placeholder="Describe your ideal design">
        </div>

        <div class="d-flex gap-2 mb-3">
            <button class="btn btn-light flex-fill"> ✨Generate</button>
            <button class="btn btn-primary flex-fill">Search</button>
        </div>

        <h6>Recently Used</h6>

        <div class="template-grid">
        
            <div class="card-box"><img src="../projects/bouquet-flowers-17341609.webp" alt=""></div>
            <div class="card-box"><img src="../projects/533f2cc3b07781c9d0575c5b6c09de7c.webp" alt=""></div>
            <div class="card-box"><img src="../projects/533f2cc3b07781c9d0575c5b6c09de7c.webp" alt=""></div>
            <div class="card-box"><img src="../projects/bouquet-flowers-17341609.webp" alt=""></div>
            <div class="card-box"><img src="../projects/bouquet-flowers-17341609.webp" alt=""></div>
            <div class="card-box"><img src="../projects/533f2cc3b07781c9d0575c5b6c09de7c.webp" alt=""></div>
            <div class="card-box"><img src="../projects/533f2cc3b07781c9d0575c5b6c09de7c.webp" alt=""></div>
            <div class="card-box"><img src="../projects/bouquet-flowers-17341609.webp" alt=""></div>
            <div class="card-box"><img src="../projects/bouquet-flowers-17341609.webp" alt=""></div>
            <div class="card-box"><img src="../projects/533f2cc3b07781c9d0575c5b6c09de7c.webp" alt=""></div>
            
            
        </div>

    </section>

    <!-- Workspace -->
    <section class="workspace">

        <div class="toolbar">
            <button>Edit</button>
            <button>🔴</button>
            <button>三</button>
            <button>ノ</button>
            <button>Effects</button>
            <button>Animate</button>
            <button>Position</button>
            <button>|</button>
            <button>🖌️ </button>
        </div>

        <div class="canvas">

            <div class="row g-3 text-center">
                <div class="col-md-3">
                    <div class="circle mx-auto"></div>
                </div>

                <div class="col-md-3">
                    <div class="square mx-auto"></div>
                </div>

                <div class="col-md-3">
                    <div class="triangle mx-auto"></div>
                </div>

                <div class="col-md-2">
                    <div class="pentagon mx-auto"></div>
                </div>
            </div>

            <div class="row g-2text-center mt-3">
                <div class="col-md-2">
                    <div class="plus mx-auto"></div>
                </div>

                <div class="col-md-5">
                    <div class="parallelogram mx-auto"></div>
                </div>

                <div class="col-md-1">
                    <div class="arrow mx-auto"></div>
                </div>

                <div class="col-md-4">
                    <div class="heart mx-auto"></div>
                </div>
            </div>

        </div>
        
        <div class="footer">
        
        </div>

    </section>
    

</div>

</body>
</html>
